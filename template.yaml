# club-rag-hub 앱 스택 (SAM). 스택 이름: club-rag-hub-app
#
# 이 스택은 Lambda, HTTP API, Lambda 실행 역할, 로그 그룹만 만듭니다.
# S3, DynamoDB, 벡터 버킷, KB, Cognito 같은 리소스는 infra/ 스크립트가 만들고, 여기서는 이름이나 ID로 참조만 합니다.
# 그래서 이 스택을 지웠다 다시 만들어도 문서와 벡터는 남습니다.
#
# 배포 역할(club-rag-hub-github-deploy)은 스택 이름으로 시작하는 리소스만 다룰 수 있습니다.
#   - Lambda 이름: ${AWS::StackName}-<이름>
#   - 실행 역할: 이름을 지정하지 않으면 CloudFormation이 "<스택 이름>-<논리 ID>-<임의 문자>"로 만듭니다.
#   - 관리형 정책은 AWSLambdaBasicExecutionRole만 붙일 수 있습니다 (X-Ray 추적 등을 켜면 배포가 막힙니다).

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: club-rag-hub app (Lambda + HTTP API). Data resources are created by infra/ scripts.

Parameters:
  Prefix:
    Type: String
    Default: club-rag-hub
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$"
    Description: infra/config.env PREFIX. Data resource names are derived from it.
  AppVersion:
    Type: String
    Default: local
    Description: Git commit shown in /health (set by GitHub Actions).
  # 아래 넷은 infra/.state/outputs.env 값입니다 (07_cognito.sh, 09_web.sh가 만듦). 공개 저장소라 기본값을 두지 않습니다.
  # sam deploy는 넘기지 않은 파라미터를 지난 배포 값으로 둡니다. 스택을 처음 만들 때만 꼭 넘겨야 합니다.
  # ID 셋은 NoEcho라서 sam deploy 출력(Actions 로그)과 스택 정보에 *****로 보입니다.
  UserPoolId:
    Type: String
    NoEcho: true
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]_[0-9A-Za-z]+$"
    Description: Cognito user pool ID (USER_POOL_ID). JWT issuer for /ask.
  WebClientId:
    Type: String
    NoEcho: true
    AllowedPattern: "^[0-9a-z]{20,40}$"
    Description: Cognito web app client ID (WEB_CLIENT_ID). Allowed token audience.
  CliClientId:
    Type: String
    NoEcho: true
    AllowedPattern: "^[0-9a-z]{20,40}$"
    Description: Cognito CLI app client ID for checks (MCP_CLIENT_ID_CLI). Allowed token audience.
  WebOrigin:
    Type: String
    AllowedPattern: "^https://[a-z0-9.-]+$"
    Description: Web page origin for CORS, without a trailing slash (WEB_URL, CloudFront).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]   # Graviton: 같은 성능에 x86보다 저렴. 순수 Python이라 차이 없음
    MemorySize: 256
    Timeout: 20              # HTTP API 최대 대기(30초)보다 짧게 (ask는 29초)
    Environment:
      Variables:
        LOG_LEVEL: INFO
        APP_VERSION: !Ref AppVersion

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      # 공개 주소라서 요청이 몰려도 Bedrock 비용이 튀지 않게 전체 요청 속도를 묶어 둡니다.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # /ask는 질문마다 Claude를 부르므로 더 좁게 묶습니다 (넘치면 API Gateway가 429).
      RouteSettings:
        "POST /ask":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
      # 웹 화면(CloudFront)과 로컬 개발 주소에서만 브라우저로 부를 수 있습니다.
      # 사전 요청(OPTIONS)은 API Gateway가 직접 답하고, 응답의 CORS 헤더도 API Gateway가 붙입니다.
      CorsConfiguration:
        AllowOrigins:
          - !Ref WebOrigin
          - http://localhost:5500
        AllowHeaders: [authorization, content-type]
        AllowMethods: [POST, OPTIONS]
        MaxAge: 600
      # 모든 경로는 기본으로 Cognito 로그인 토큰이 있어야 합니다. 토큰이 없거나 틀리면 API Gateway가 401.
      # 대상(audience)은 웹 클라이언트와 점검용 cli 클라이언트. access 토큰은 aud 대신 client_id로 확인됩니다.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
              audience:
                - !Ref WebClientId
                - !Ref CliClientId

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-health
      Description: GET /health - checks S3, DynamoDB and Bedrock embedding access
      CodeUri: src/health/
      Handler: health.handler
      Environment:
        Variables:
          DOCS_BUCKET: !Sub ${Prefix}-docs-${AWS::AccountId}
          REGISTRY_TABLE: !Sub ${Prefix}-kb-registry
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          EMBED_DIM: "1024"
      # 확인에 필요한 읽기 권한만 줍니다.
      Policies:
        - Statement:
            - Sid: ListDocsBucket
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::${Prefix}-docs-${AWS::AccountId}
            - Sid: ReadKbRegistry
              Effect: Allow
              Action: dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-kb-registry
            - Sid: InvokeEmbeddingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE   # 상태 확인은 로그인 없이

  # 로그를 무기한 쌓지 않도록 보관 기간을 정해 둡니다.
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  # 웹 챗봇 질의응답. kb_search로 근거를 모으고 Claude Sonnet 4.6(global 추론 프로필)이 출처 번호를 붙여 답합니다.
  # kb_search를 같이 묶으려고 CodeUri는 src/ 전체, Handler는 폴더/파일.함수입니다 (노션 '코드 묶는 방식').
  AskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ask
      Description: POST /ask - kb_search evidence + Claude answer with numbered sources
      CodeUri: src/
      Handler: ask/ask.handler
      MemorySize: 512          # 첫 호출 때 boto3를 빨리 불러오도록 CPU를 조금 더
      Timeout: 29              # HTTP API가 30초에서 끊으므로 그보다 조금 짧게
      Environment:
        Variables:
          REGISTRY_TABLE: !Sub ${Prefix}-kb-registry
          ANSWER_MODEL_ID: global.anthropic.claude-sonnet-4-6
      # 읽기와 모델 호출만. 쓰기 권한은 없습니다.
      Policies:
        - Statement:
            - Sid: ReadKbRegistry
              Effect: Allow
              Action: dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-kb-registry
            - Sid: RetrieveFromKbs      # KB ID를 적지 않아서 KB를 추가해도 재배포가 필요 없음
              Effect: Allow
              Action: bedrock:Retrieve
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
            # global 추론 프로필은 세 곳에 권한이 필요합니다: 이 리전의 프로필, 이 리전의 모델, 리전 없는(global) 모델.
            # 모델 두 곳은 이 프로필을 거칠 때만 허용합니다 (AWS 문서 Global cross-Region inference).
            - Sid: InvokeClaudeProfile
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6
            - Sid: InvokeClaudeRegionalModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-6
              Condition:
                StringEquals:
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6
            - Sid: InvokeClaudeGlobalModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.claude-sonnet-4-6
              Condition:
                StringEquals:
                  aws:RequestedRegion: unspecified
                  bedrock:InferenceProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ask
            Method: POST       # 로그인 필요 (HttpApi의 기본 권한 부여자)

  AskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AskFunction}
      RetentionInDays: 14

  # MCP 도구 Lambda. HTTP API가 아니라 AgentCore Gateway가 부릅니다 (infra/08_mcp_gateway.sh).
  # Gateway는 자기 실행 역할로 이 함수를 부르므로 여기에는 호출 권한(리소스 정책)을 두지 않습니다.
  # 검색 도구(list_sources, search, read_document)가 kb_search를 쓰므로 ask와 같은 방식으로 src/ 전체를 묶습니다.
  ToolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-tools
      Description: MCP search tools (list_sources, search, read_document) called by AgentCore Gateway
      CodeUri: src/
      Handler: tools/tools.handler
      Timeout: 30              # kb_search의 AWS 호출은 최악이면 (연결 3초 + 읽기 10초) x 2회 = 26초
      Environment:
        Variables:
          REGISTRY_TABLE: !Sub ${Prefix}-kb-registry
          DOCS_BUCKET: !Sub ${Prefix}-docs-${AWS::AccountId}
      # 읽기만: 레지스트리 조회, KB 검색, KB 폴더의 문서 읽기(read_document). ListBucket은 주지 않습니다.
      Policies:
        - Statement:
            - Sid: ReadKbRegistry
              Effect: Allow
              Action: dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-kb-registry
            - Sid: RetrieveFromKbs
              Effect: Allow
              Action: bedrock:Retrieve
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
            - Sid: ReadKbFolders        # school/kb/, clubs/<동아리>/kb/ 아래만. raw/, _sources/는 못 읽음
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${Prefix}-docs-${AWS::AccountId}/*/kb/*

  ToolsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ToolsFunction}
      RetentionInDays: 14

  # Gateway 요청 인터셉터. 로그인 토큰에서 그룹을 꺼내 도구 입력값(caller_groups)에 넣습니다.
  # Gateway가 토큰을 도구 Lambda에 넘기지 않기 때문에 필요합니다. 부르는 쪽은 Gateway뿐이고(실행 역할),
  # 이 함수는 AWS를 부르지 않으므로 기본 로그 권한만 있습니다.
  InterceptorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-interceptor
      Description: AgentCore Gateway request interceptor - adds caller groups from the JWT to tools/call
      CodeUri: src/interceptor/
      Handler: interceptor.handler
      MemorySize: 128
      Timeout: 5               # 모든 MCP 요청 앞에서 돌므로 짧게

  InterceptorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InterceptorFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HealthUrl:
    Description: GET /health
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
  HealthFunctionName:
    Value: !Ref HealthFunction
  AskUrl:
    Description: POST /ask (Cognito login token required)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/ask
  ToolsFunctionArn:
    Description: MCP tools Lambda (AgentCore Gateway target)
    Value: !GetAtt ToolsFunction.Arn
  InterceptorFunctionArn:
    Description: AgentCore Gateway request interceptor
    Value: !GetAtt InterceptorFunction.Arn
