# club-rag-hub 앱 스택 (SAM). 스택 이름: club-rag-hub-app
#
# 이 스택은 Lambda, HTTP API, Lambda 실행 역할, 로그 그룹만 만듭니다.
# S3, DynamoDB, 벡터 버킷, KB 같은 데이터 리소스는 infra/ 스크립트가 만들고, 여기서는 이름으로 참조만 합니다.
# 그래서 이 스택을 지웠다 다시 만들어도 문서와 벡터는 남습니다.
#
# 배포 역할(club-rag-hub-github-deploy)은 스택 이름으로 시작하는 리소스만 다룰 수 있습니다.
#   - Lambda 이름: ${AWS::StackName}-<이름>
#   - 실행 역할: 이름을 지정하지 않으면 CloudFormation이 "<스택 이름>-<논리 ID>-<임의 문자>"로 만듭니다.
#   - 관리형 정책은 AWSLambdaBasicExecutionRole만 붙일 수 있습니다 (X-Ray 추적 등을 켜면 배포가 막힙니다).

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: club-rag-hub app (Lambda + HTTP API). Data resources are created by infra/ scripts.

Parameters:
  Prefix:
    Type: String
    Default: club-rag-hub
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,18}[a-z0-9]$"
    Description: infra/config.env PREFIX. Data resource names are derived from it.
  AppVersion:
    Type: String
    Default: local
    Description: Git commit shown in /health (set by GitHub Actions).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]   # Graviton: 같은 성능에 x86보다 저렴. 순수 Python이라 차이 없음
    MemorySize: 256
    Timeout: 20              # HTTP API 최대 대기(30초)보다 짧게
    Environment:
      Variables:
        LOG_LEVEL: INFO
        APP_VERSION: !Ref AppVersion

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      # 공개 주소라서 요청이 몰려도 Bedrock 비용이 튀지 않게 전체 요청 속도를 묶어 둡니다.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-health
      Description: GET /health - checks S3, DynamoDB and Bedrock embedding access
      CodeUri: src/health/
      Handler: health.handler
      Environment:
        Variables:
          DOCS_BUCKET: !Sub ${Prefix}-docs-${AWS::AccountId}
          REGISTRY_TABLE: !Sub ${Prefix}-kb-registry
          EMBED_MODEL_ID: amazon.titan-embed-text-v2:0
          EMBED_DIM: "1024"
      # 확인에 필요한 읽기 권한만 줍니다.
      Policies:
        - Statement:
            - Sid: ListDocsBucket
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::${Prefix}-docs-${AWS::AccountId}
            - Sid: ReadKbRegistry
              Effect: Allow
              Action: dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-kb-registry
            - Sid: InvokeEmbeddingModel
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET

  # 로그를 무기한 쌓지 않도록 보관 기간을 정해 둡니다.
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  HealthUrl:
    Description: GET /health
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health
  HealthFunctionName:
    Value: !Ref HealthFunction
